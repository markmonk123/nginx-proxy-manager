# Working example proxy configuration
# This example shows how to add a simple proxy rule

server {
    listen 80;
    server_name test.local localhost;
    
    location /test {
        return 200 'Proxy rule is working! This is from /test path';
        add_header Content-Type text/plain;
    }
}

