# Admin interface server
server {
    listen 81;
    server_name _;

    location / {
        return 200 '<html><body><h1>Nginx Proxy Manager - Local Dev</h1><p>This is a simplified version for local development</p><p>Configure proxy rules by editing nginx configuration files</p><h2>Usage:</h2><ul><li>Add your proxy configurations to /etc/nginx/conf.d/</li><li>Reload nginx: nginx -s reload</li></ul></body></html>';
        add_header Content-Type text/html;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

